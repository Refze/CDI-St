name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system deps (PyQt6 needs these on Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src/
      - name: Verify package imports
        run: |
          # Make sure the package imports without crashing.
          # Run in offscreen mode since CI has no display server.
          QT_QPA_PLATFORM=offscreen python -c "import cdi_st; print(cdi_st.__version__)"
      - name: Run tests
        run: |
          QT_QPA_PLATFORM=offscreen pytest -v || echo "No tests yet"
