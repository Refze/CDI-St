name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff only
        run: python -m pip install --upgrade ruff

      - name: Lint with ruff (non-blocking — informational only)
        run: ruff check src/ || true
        continue-on-error: true

      - name: Python syntax check on every source file
        run: |
          for f in src/cdi_st/*.py; do
            python -m py_compile "$f"
          done

  build:
    name: Build sdist & wheel
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Verify with twine
        run: twine check dist/*