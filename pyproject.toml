[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "cdi-stools"
version = "0.1.0"
description = "Coherent Diffraction Imaging Simulation Tools — BCDI simulation and NN-based phase retrieval"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Soufiane SAIDI", email = "saidisoufiane@hotmail.com" },
]
keywords = [
    "BCDI",
    "Bragg coherent diffraction imaging",
    "X-ray diffraction",
    "phase retrieval",
    "neural network",
    "synchrotron",
    "crystallography",
    "ID01",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: X11 Applications :: Qt",
]

dependencies = [
    "numpy>=1.22",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "pandas>=1.5",
    "PyQt6>=6.4",
    "PyQt6-WebEngine>=6.4",
    "torch>=2.0",
    "h5py>=3.7",
    "scikit-image>=0.20",
    "diffpy.structure>=3.1",
    "plotly>=5.13",
]

[project.optional-dependencies]
# ID01 / synchrotron native data formats
id01 = [
    "silx>=2.0",
    "xrayutilities>=1.7",
]
# VTK export for ParaView (has a manual fallback if not installed)
vtk = [
    "vtk>=9.2",
]
# Everything
all = [
    "cdi-st[id01,vtk]",
]
# Development
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/Refze/CDI-Stools"
Documentation = "https://github.com/Refze/CDI-Stools#readme"
Repository = "https://github.com/Refze/CDI-Stools"
Issues = "https://github.com/Refze/CDI-Stools/issues"
Changelog = "https://github.com/Refze/CDI-Stools/blob/main/CHANGELOG.md"

# Console command: typing `cdi-st` in the terminal launches the GUI
[project.scripts]
cdi-st = "cdi_st.bcdi_gui:main"
cdi-stools = "cdi_st.bcdi_gui:main"

# ── Hatchling build configuration ───────────────────────────────────────────
# Tell Hatchling where the source lives and which non-Python files to include.
[tool.hatch.build.targets.wheel]
packages = ["src/cdi_st"]

[tool.hatch.build.targets.wheel.force-include]
"src/cdi_st/CDI_ST_logo.png" = "cdi_st/CDI_ST_logo.png"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

# ── Optional tool configuration ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pragmatic linting — most existing code already breaks heavy strict mode
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long — many scientific lines exceed 100
    "E402",   # module-level import not at top — common with conditional Qt imports
    "E731",   # don't assign a lambda
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
